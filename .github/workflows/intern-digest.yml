name: Internship digest

on:
  schedule:
    # 13:00 UTC daily ≈ 9:00am ET / 6:00am PT. GitHub may delay cron by a few
    # minutes under load — that's fine, this isn't time-critical.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the digest but file no issue and record nothing as seen"
        type: boolean
        default: false

# contents: write -> push the updated seen_ids.json. issues: write -> file the digest.
permissions:
  contents: write
  issues: write

# Never let two runs race on seen_ids.json.
concurrency:
  group: intern-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step: intern_pipeline.py is stdlib-only by design.

      - name: Run pipeline
        run: python intern_pipeline.py ${{ inputs.dry_run && '--dry-run' || '--issue' }}

      - name: Upload digest.html (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest.html
          if-no-files-found: warn

      # digest.md only exists when there was something new, so this doubles as the
      # "anything to report?" check.
      - name: File digest as an issue
        id: file_issue
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f digest.md ]; then
            echo "no new roles this run — no issue filed"
            exit 0
          fi
          count=$(python -c "import json;print(len(json.load(open('pending_ids.json'))))")
          # gh issue create hard-fails on an unknown label; --force makes this idempotent.
          gh label create digest --color 0E8A16 \
            --description "Automated internship digest" --force
          gh issue create \
            --title "🗂️ Internship digest · $count new · $(date -u +'%b %d')" \
            --body-file digest.md \
            --label digest \
            --repo "$GITHUB_REPOSITORY"
          echo "filed=true" >> "$GITHUB_OUTPUT"

      # Runs on every non-dry run, not just ones that filed an issue: even a quiet day
      # discovers new ATS boards, and those must be kept. The --commit-seen promotion
      # is what's gated on the issue actually existing — if it failed, the ids stay
      # pending and the next run retries them rather than losing them silently.
      - name: Persist state
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "${{ steps.file_issue.outputs.filed }}" = "true" ]; then
            python intern_pipeline.py --commit-seen
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ats_boards.json is the discovered-board memory — it only ever grows, and
          # persisting it is what makes each run's reach wider than the last.
          for f in seen_ids.json ats_boards.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no state changes — nothing to commit"
          else
            git commit -m "chore: update digest state [skip ci]"
            git push
          fi
